[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ft-moulinette-runners"
version = "0.1.0"
description = "Moteurs d'exécution de ft-moulinette : local, mock et Cloud Run"
requires-python = ">=3.10"

[project.optional-dependencies]
# Obtention de l'ID token Google côté worker VPS. Versions explicites (reproductibilité).
cloudrun = ["google-auth==2.63.1", "requests==2.34.2"]

[tool.setuptools.packages.find]
include = ["ft_moulinette_runners*"]

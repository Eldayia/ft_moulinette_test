[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ft-moulinette-web"
version = "0.1.0"
description = "Interface web locale de ft-moulinette"
requires-python = ">=3.10"

[project.scripts]
ft-moulinette-web = "ft_moulinette_web.__main__:main"

[tool.setuptools.packages.find]
include = ["ft_moulinette_web*"]

[tool.setuptools.package-data]
ft_moulinette_web = ["static/*"]
